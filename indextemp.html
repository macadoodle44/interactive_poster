<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <div>
        <label for="bgcolor">background color</label>
        <input id="bgcolor" type="color" value="#ffffff" />
        <output for="bgcolor"></output>
    </div>

     <p>
        <label for="skewx">skew x</label>
        <input id="skewx" type="range" min="-90" max="90" value="0" />

        <label for="skewy">skew y</label>
        <input id="skewy" type="range" min="-90" max="90" value="0" />
        <output for="skewx skewy"></output>
    </p>

    <p>
        <label for="scale">scale</label>
        <input id="scale" type="range" min="0.1" max="3" step="0.1" value="1" />
        <output for="scale"></output>
    </p>


    <div>
        <img id="img" src="biscuit4.5.png" alt="ear biscuit image" />  
    </div>

    <script src="posterscript.js"></script>
</body>
</html>
